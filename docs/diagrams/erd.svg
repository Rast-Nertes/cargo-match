<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold">ERD CargoMatch (3NF)</text>
  <g stroke="#334155" fill="#fff">
