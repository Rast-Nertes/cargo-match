  <text x="400" y="268" font-size="10">1:N</text>
  <line x1="520" y1="170" x2="520" y2="220" stroke="#64748b" marker-end="url(#e)"/>
  <text x="530" y="200" font-size="10">1:N</text>
  <line x1="310" y1="160" x2="310" y2="220" stroke="#64748b" marker-end="url(#e)"/>
